---
name: Reusable React TypeScript CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Version of Node.js to use'
        type: string
        default: '20'
      install-command:
        description: 'Command to install dependencies'
        type: string
        default: 'npm ci'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: ${{ inputs.install-command }}

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: build/
          retention-days: 1